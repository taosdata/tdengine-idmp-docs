# External link check for current zh/en docs.
# Docusaurus build covers internal links and anchors. CI passes --root-dir
# so site-root paths are not fetched. This file skips example hosts.

# Skip relative file links and mailto. Docusaurus checks those at build time.
scheme = ["http", "https"]
include_verbatim = false
include_mail = false
exclude_all_private = true
exclude_loopback = true

exclude = [
  '(?i)^https?://([a-z0-9-]+\.)*example\.com',
  'mysql-host',
  'pg-host',
  'influx-host',
  '(?i)^https?://ip[:/]',
  'idmp-host',
  'your-maven-repo',
  'your-pypi-server',
  '\[host',
]
